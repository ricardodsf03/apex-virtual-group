name: Apex Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Validate Apex
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check service-worker.js

      - name: Run unit tests
        run: node --test tests/app.test.mjs

      - name: Run Apex Quality Gate
        run: node scripts/quality-gate.mjs

      - name: Check patch formatting
        run: git diff --check HEAD~1 HEAD
