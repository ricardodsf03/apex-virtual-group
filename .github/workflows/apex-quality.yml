name: Apex Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Validate Apex
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check service-worker.js
          node --check supabase-config.js
          node --check supabase-client.js
          node --check supabase-auth.js
          node --check auth-core.js
          node --check sync-core.js
          node --check supabase-sync.js

      - name: Run unit tests
        run: node --test tests/*.test.mjs

      - name: Run Apex Quality Gate
        run: node scripts/quality-gate.mjs

      - name: Check patch formatting
        run: git diff --check HEAD~1 HEAD

  rls:
    name: Testar migrações e RLS (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Aplicar migrações e testar isolamento RLS
        run: ./scripts/test-rls.sh
